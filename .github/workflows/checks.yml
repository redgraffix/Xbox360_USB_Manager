name: Checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: Check repository hygiene
        run: python scripts/check_public_tree.py
      - name: Check archive helper
        run: python -c "from runtime import find_7zip; print(find_7zip())"
      - name: Install test dependencies
        run: python -m pip install -r requirements-test.txt
      - name: Test with synthetic local fixtures
        run: python -m unittest -v test_converter test_imports test_security test_performance test_destinations
      - name: Install build dependencies
        run: python -m pip install -r requirements-build.txt
      - name: Build Windows executable
        run: python scripts/build_windows.py
      - name: Smoke test executable imports
        shell: pwsh
        run: |
          $app = Start-Process -FilePath '.\dist\Xbox360 Converter\Xbox360 Converter.exe' -ArgumentList '--help' -WindowStyle Hidden -Wait -PassThru
          if ($app.ExitCode -ne 0) { throw "Executable smoke test failed: $($app.ExitCode)" }
