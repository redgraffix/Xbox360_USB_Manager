name: Checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - name: Check repository hygiene
        run: python scripts/check_public_tree.py
      - name: Check archive helper
        run: python -c "from runtime import find_7zip; print(find_7zip())"
      - name: Test with synthetic local fixtures
        run: python -m unittest -v test_converter test_imports test_security
