name: Checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Check repository hygiene
        run: python scripts/check_public_tree.py
      - name: Check archive helper
        run: python -c "from runtime import find_7zip; print(find_7zip())"
      - name: Test with synthetic local fixtures
        run: python -m unittest -v test_converter test_imports test_security
